<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Background Editor - master artwork.

    A head-and-shoulders portrait whose wind-blown hair streams across a clean
    cut: left of the cut the original photo background (teal, with soft bokeh),
    right of it a transparency checkerboard, i.e. the background is gone but
    every lock and fine strand of hair is kept.

    Geometry: the tile spans 16..240 with 32-unit checker cells, so tile and
    cells land on whole pixels at 48, 64, 96, 128, 256 and 512 px (and at 40 px
    after a half-pixel shift, see build_icon.py). Frames of 32 px and smaller
    are drawn from logo_small.svg.
    A mask is used instead of clipPath because QtSvg does not implement
    clipPath; browsers and editors render both the same way.
  -->
  <defs>
    <mask id="tile" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="16" y="16" width="224" height="224" rx="52" fill="#FFFFFF"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="background" x1="16" y1="240" x2="150" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D6C0"/>
      <stop offset="1" stop-color="#0E97B8"/>
    </linearGradient>
    <!-- shadow the lifted background casts on the checkerboard, perpendicular to the cut -->
    <linearGradient id="cutShadow" x1="124" y1="128" x2="133.4" y2="131.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="80" y1="62" x2="210" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35247F"/>
      <stop offset="1" stop-color="#170F40"/>
    </linearGradient>
    <linearGradient id="top" x1="60" y1="176" x2="180" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9467FA"/>
      <stop offset="1" stop-color="#6A2BD6"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="140" x2="0" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B8F2"/>
      <stop offset="1" stop-color="#E6E0FD"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="16" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- drop shadow under the tile -->
  <rect x="20" y="24" width="216" height="220" rx="50" fill="#000000" opacity="0.30" filter="url(#soft)"/>

  <g mask="url(#tile)">
    <!-- removed background: transparency checkerboard over the whole tile -->
    <rect x="16" y="16" width="224" height="224" fill="#FFFFFF"/>
    <path fill="#D6DAEE" d="M16 16h32v32h-32z M80 16h32v32h-32z M144 16h32v32h-32z M208 16h32v32h-32z
      M48 48h32v32h-32z M112 48h32v32h-32z M176 48h32v32h-32z
      M16 80h32v32h-32z M80 80h32v32h-32z M144 80h32v32h-32z M208 80h32v32h-32z
      M48 112h32v32h-32z M112 112h32v32h-32z M176 112h32v32h-32z
      M16 144h32v32h-32z M80 144h32v32h-32z M144 144h32v32h-32z M208 144h32v32h-32z
      M48 176h32v32h-32z M112 176h32v32h-32z M176 176h32v32h-32z
      M16 208h32v32h-32z M80 208h32v32h-32z M144 208h32v32h-32z M208 208h32v32h-32z"/>
    <rect x="16" y="16" width="224" height="224" fill="url(#cutShadow)"/>

    <!-- original background, left of the cut, with a few out-of-focus lights -->
    <path fill="url(#background)" d="M16 16 L164 16 L84 240 L16 240 Z"/>
    <circle cx="58" cy="44" r="22" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="40" cy="112" r="13" fill="#FFFFFF" opacity="0.14"/>
    <circle cx="52" cy="150" r="8" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="30" cy="178" r="6" fill="#FFFFFF" opacity="0.10"/>

    <!-- the cut -->
    <path d="M164 16 L84 240" stroke="#FFFFFF" stroke-width="3"/>

    <!-- neck, drawn first so the neckline of the top reveals it -->
    <path fill="url(#neck)" d="M99 132 V180 H129 V132 Z"/>
    <!-- shoulders with a round neckline -->
    <path fill="url(#top)" d="M30 256 C30 203 60 172 96 167 C102 184 126 184 132 167 C168 172 198 203 198 256 Z"/>
    <!-- hair mass: the left side hugs the face, the rest streams to the right in three locks -->
    <path fill="url(#hair)" d="M84 158 C70 146 64 128 66 112 C70 82 94 62 128 62 C160 62 182 74 196 88
      C206 100 216 100 226 92 C222 108 210 114 196 112
      C210 122 222 124 232 116 C226 134 212 140 194 138
      C206 148 214 152 224 150 C216 164 196 170 176 162
      C164 156 156 148 152 140 L96 140 C94 146 92 152 84 158 Z"/>
    <!-- face -->
    <path fill="#F4F0FF" d="M114 80 C133 80 145 94 145 112 C145 132 131 150 114 150 C97 150 83 132 83 112 C83 94 95 80 114 80 Z"/>
    <!-- shade the hair casts on the right cheek -->
    <path fill="#DDD4FB" d="M145 112 C145 132 131 150 114 150 C126 144 136 132 138 112 C139 104 141 98 143 96 C144 101 145 106 145 112 Z"/>
    <!-- fringe: slanted hairline, swept to the right -->
    <path fill="url(#hair)" d="M82 112 C78 88 96 70 124 70 C152 70 168 90 158 126 C156 130 152 132 148 130 C140 106 110 90 82 112 Z"/>
    <!-- sheen on the crown and along the streaming hair -->
    <path fill="#7866E2" opacity="0.5" d="M88 94 C96 78 112 68 132 68 C116 72 102 82 94 100 Z"/>
    <path fill="#6A58D6" opacity="0.35" d="M146 70 C170 70 190 80 206 94 C208 96 210 98 212 99 C196 92 176 82 146 70 Z"/>
    <!-- fine strands flying free over the checkerboard -->
    <path fill="url(#hair)" d="M184 80 C198 73 214 71 230 74 C214 74 200 78 186 84 Z"/>
    <path fill="url(#hair)" d="M206 100 C216 102 226 101 236 97 C226 103 216 104 206 103 Z"/>
    <path fill="url(#hair)" d="M204 144 C214 146 224 145 234 140 C224 147 214 148 204 147 Z"/>
    <path fill="url(#hair)" d="M180 163 C194 170 208 173 224 171 C208 176 194 175 178 167 Z"/>

    <!-- soft top light over the whole tile -->
    <rect x="16" y="16" width="224" height="224" fill="url(#gloss)"/>
  </g>

  <!-- hairline edge so the white cells keep the tile shape on light backgrounds -->
  <rect x="17" y="17" width="222" height="222" rx="51" fill="none" stroke="#1E1B4B" stroke-opacity="0.14" stroke-width="2"/>
</svg>
